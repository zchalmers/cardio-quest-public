name: cardio_quest
description: An endless runner powered by Bluetooth FTMS cardio machines.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  flame: 1.35.1
  flutter_soloud: 3.5.3
  flutter_secure_storage: ^10.3.1
  flutter_ftms: 1.4.0
  flutter_tts: ^4.2.5
  flutter_web_auth_2: ^5.0.3
  http: ^1.6.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
